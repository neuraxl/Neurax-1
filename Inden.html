<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuraX-Ultime — Intelligence Artificielle Évoluée</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #58a6ff;
      text-shadow: 0 0 15px rgba(0, 204, 255, 0.8);
    }

    p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: auto;
      text-shadow: 0 0 10px rgba(0, 204, 255, 0.6);
    }

    .button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      font-size: 1rem;
      background: #238636;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      box-shadow: 0 0 15px rgba(0, 204, 255, 0.6);
    }

    .button:hover {
      background: #2ea043;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    /* Animation de fond */
    @keyframes backgroundMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .background-animation {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #58a6ff, #238636, #2ea043, #58a6ff);
      background-size: 400% 400%;
      animation: backgroundMove 10s ease infinite;
      z-index: -1;
      opacity: 0.15;
    }
  </style>
</head>
<body>

  <!-- Fond animé -->
  <div class="background-animation"></div>

  <img src="logo_neurax.png" alt="Logo du projet NeuraX-Ultime" width="120">
  <h1>NeuraX-Ultime</h1>
  <p>L’intelligence artificielle la plus avancée jamais conçue.<br> NeuraX-Ultime est un cerveau numérique autonome, modulable, interconnecté et évolutif. Parlez-lui, testez-le, et découvrez son potentiel infini.</p>

  <button class="button" onclick="window.location.href='chat.html'">Lancer le Chatbot</button>

  <div class="footer">
    <p>
      Conçu par <a href="https://github.com/neuraxl" target="_blank">neuraxl</a> — <a href="https://github.com/neuraxl/neuraX-ultime" target="_blank">Voir le code sur GitHub</a>
    </p>
  </div>

</body>
</html>
